<table class="data-table">
  <thead>
    <tr>
      <th *ngFor="let column of columns" (click)="onSort(column.key)" class="sortable">
        {{ column.label }} {{ getSortIcon(column.key) }}
      </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of data" (click)="onRowClick(row)" class="clickable-row">
      <td *ngFor="let column of columns">
        {{ row[column.key] }}
      </td>
    </tr>
  </tbody>
</table>
