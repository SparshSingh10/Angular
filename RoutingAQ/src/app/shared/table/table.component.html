<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th *ngFor="let col of columns" (click)="sortBy(col)" style="cursor: pointer;">
        {{ col }}
      </th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let row of data" (click)="onRowClick(row)">
     <td *ngFor="let col of columns">
  {{ getValue(row, col) }}
</td>


    </tr>
  </tbody>
</table>
