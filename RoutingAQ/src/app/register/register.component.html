<div class="register-container">
  <h2>Register</h2>

  <form [formGroup]="registerForm" (ngSubmit)="registerUser()">

    <div class="form-group">
      <input type="text" placeholder="Enter name" formControlName="name">
      <span *ngIf="name?.hasError('required') && name?.touched" class="error">Name is required</span>
    </div>

    <div class="form-group">
      <input type="email" placeholder="Enter email" formControlName="email">
      <span *ngIf="email?.touched && email?.hasError('required')" class="error">
        Email is required
      </span>
      <span *ngIf="email?.touched && email?.hasError('email')" class="error">
        Enter a valid email (example: abc@gmail.com)
      </span>
    </div>

    <div class="form-group">
      <input type="password" placeholder="Enter password" formControlName="password">
      <span *ngIf="password?.hasError('required') && password?.touched" class="error">Password is Required</span>
      <span *ngIf="password?.hasError('minlength') && password?.touched" class="error">Password must be at least 4 characters</span>
    </div>

    <div class="form-group">
      <select formControlName="role">
        <option value="">Select Role</option>
        <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
      </select>
      <span *ngIf="role?.hasError('required') && role?.touched" class="error">Role is required</span>
    </div>

    <button type="submit" class="btn-primary">Register</button>
  </form>

  <p class="message" [ngClass]="{'success': message.includes('successful'), 'error': !message.includes('successful')}">{{ message }}</p>

  <div class="login-link">
    <p>Already have an account? <a routerLink="/login">Login here</a></p>
  </div>
</div>
