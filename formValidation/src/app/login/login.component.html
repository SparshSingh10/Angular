<h2>Login Form</h2>

<form [formGroup]="loginForm" (ngSubmit)="loginSubmit()">

  <input type="text" placeholder="Enter name" formControlName="name">
  <span *ngIf="name?.hasError('required') && name?.touched">Name is required</span>

 <input type="email" placeholder="Enter email" formControlName="email">

<span *ngIf="email?.touched && email?.hasError('required')">
  Email is required
</span>

<span *ngIf="email?.touched && email?.hasError('email')">
  Enter a valid email (example: abc@gmail.com)
</span>

  <input type="password" placeholder="Enter password" formControlName="password">
  <span *ngIf="password?.hasError('required') && password?.touched">Password is Required</span>

  <select formControlName="role">
    <option value="">Select Role</option>
    <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
  </select>
  <span *ngIf="role?.hasError('required') && role?.touched">Role is required</span>

  <button type="submit">Login</button>
</form>

<p>{{ message }}</p>

<button *ngIf="!isRegistered" type="button" (click)="registerUser()">
  Register
</button>
